appId: com.projectquicklaunch.app
productName: ProjectQuickLaunch
# 直接复用 node_modules 中已下载好的 electron 运行时，避免重新下载大文件
electronDist: node_modules/electron/dist
# 自动更新数据源：GitHub Releases（构建时会生成 latest.yml）
publish:
  provider: github
  owner: cy547
  repo: ProjectQuickLaunch
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - build/icon.png
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: ProjectQuickLaunch
